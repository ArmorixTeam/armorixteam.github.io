<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Parallax</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
/* =========================
   CORE THEME
========================= */
:root {
  --bg: #05050a;
  --panel: rgba(18,18,30,0.65);
  --panel-solid: #10101c;
  --border: rgba(255,255,255,0.08);
  --text: #ffffff;
  --muted: #9aa0b4;
  --purple: #8b5cf6;
  --pink: #ec4899;
  --cyan: #22d3ee;
  --glow: 0 0 40px rgba(139,92,246,.45);
}

/* =========================
   GLOBAL
========================= */
* {
  box-sizing: border-box;
  font-family: Inter, system-ui, -apple-system;
}

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}

/* =========================
   BACKGROUND FX
========================= */
.bg {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(600px 400px at 20% 10%, rgba(139,92,246,.18), transparent),
    radial-gradient(500px 500px at 80% 80%, rgba(34,211,238,.12), transparent),
    radial-gradient(400px 400px at 70% 20%, rgba(236,72,153,.12), transparent);
  animation: floatBg 12s ease-in-out infinite alternate;
  z-index: -1;
}

@keyframes floatBg {
  from { transform: translateY(0); }
  to { transform: translateY(-20px); }
}

/* =========================
   APP LAYOUT
========================= */
.app {
  width: 100%;
  height: 100svh;
  display: grid;
  grid-template-columns: 78px 1fr;
}

/* =========================
   SIDEBAR
========================= */
.sidebar {
  backdrop-filter: blur(18px);
  background: linear-gradient(180deg,#0b0b15,#07070c);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 14px 0;
  gap: 14px;
}

.logo {
  font-weight: 900;
  font-size: 14px;
  letter-spacing: 2px;
  color: var(--purple);
  margin-bottom: 8px;
}

.nav {
  width: 50px;
  height: 50px;
  border-radius: 16px;
  display: grid;
  place-items: center;
  color: var(--muted);
  cursor: pointer;
  transition: .25s;
}

.nav:hover,
.nav.active {
  background: rgba(139,92,246,.15);
  color: var(--purple);
  box-shadow: var(--glow);
}

/* =========================
   MAIN
========================= */
.main {
  display: flex;
  flex-direction: column;
  height: 100%;
}

/* =========================
   HEADER
========================= */
.header {
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(12px);
}

.header b {
  font-size: 18px;
  letter-spacing: .5px;
}

.hud {
  display: flex;
  gap: 18px;
  font-size: 11px;
  color: var(--muted);
}

/* =========================
   CONTENT
========================= */
.content {
  flex: 1;
  position: relative;
}

.panel {
  position: absolute;
  inset: 0;
  padding: 16px;
  display: none;
}

.panel.active {
  display: flex;
  animation: fade .3s ease;
}

@keyframes fade {
  from { opacity:0; transform: translateY(10px); }
  to { opacity:1; transform:none; }
}

/* =========================
   DISCLAIMER
========================= */
.disclaimer {
  justify-content: center;
  align-items: center;
  flex-direction: column;
  gap: 18px;
  text-align: center;
}

.warn {
  width: 96px;
  height: 96px;
  filter: drop-shadow(var(--glow));
}

.disclaimer button {
  padding: 14px 28px;
  border-radius: 18px;
  border: none;
  font-weight: 700;
  background: linear-gradient(135deg,var(--purple),var(--pink));
  color: white;
}

/* =========================
   EDITOR
========================= */
.editor {
  flex: 1;
  background: var(--panel);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 18px;
  font-family: ui-monospace, SFMono-Regular;
  white-space: pre;
  overflow: auto;
  outline: none;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.02);
}

/* =========================
   SCRIPTBLOX
========================= */
.scriptblox {
  flex-direction: column;
  gap: 16px;
}

.sb-top {
  display: flex;
  gap: 12px;
}

.sb-top input {
  flex: 1;
  padding: 14px;
  border-radius: 16px;
  border: 1px solid var(--border);
  background: var(--panel-solid);
  color: white;
}

.sb-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(240px,1fr));
  gap: 16px;
}

.card {
  background: var(--panel);
  backdrop-filter: blur(18px);
  border: 1px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
  cursor: pointer;
  transition: .3s;
}

.card:hover {
  transform: translateY(-6px) scale(1.02);
  box-shadow: var(--glow);
}

.thumb {
  height: 140px;
  background: #000;
}

.thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.card-info {
  padding: 14px;
}

.card-info b {
  font-size: 14px;
}

.card-info small {
  color: var(--muted);
}

/* =========================
   EXEC BAR
========================= */
.exec {
  position: absolute;
  right: 20px;
  bottom: 20px;
  display: flex;
  gap: 14px;
}

.exec-btn {
  width: 56px;
  height: 56px;
  border-radius: 20px;
  background: linear-gradient(135deg,#15152e,#090912);
  border: 1px solid var(--border);
  display: grid;
  place-items: center;
  cursor: pointer;
}

.exec-btn:hover {
  box-shadow: var(--glow);
}
</style>
</head>

<body>
<div class="bg"></div>

<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="logo">PX</div>
    <div class="nav active" onclick="openPanel('editor')">✏️</div>
    <div class="nav" onclick="openPanel('scriptblox')">☁️</div>
    <div class="nav" onclick="openPanel('settings')">⚙️</div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="header">
      <b>Parallax</b>
      <div class="hud">
        <span>FPS: 60</span>
        <span>JIT: Enabled</span>
        <span>UNC: 72%</span>
      </div>
    </div>

    <div class="content">

      <!-- DISCLAIMER -->
      <div class="panel active disclaimer" id="disclaimer">
        <svg class="warn" viewBox="0 0 24 24" fill="none" stroke="purple" stroke-width="1.5">
          <path d="M12 2L22 20H2L12 2Z"/>
        </svg>
        <h2>Disclaimer</h2>
        <p style="color:var(--muted);max-width:420px">
          Use at your own risk. Parallax is not responsible for bans,
          terminations, or disciplinary actions.
        </p>
        <button onclick="dismiss()">Continue</button>
      </div>

      <!-- EDITOR -->
      <div class="panel" id="editor">
        <div class="editor" contenteditable spellcheck="false">
-- Parallax Executor
print("Injected.")
        </div>
      </div>

      <!-- SCRIPTBLOX -->
      <div class="panel scriptblox" id="scriptblox">
        <div class="sb-top">
          <input id="search" placeholder="Search ScriptBlox…" />
          <button onclick="search()">Search</button>
        </div>
        <div class="sb-grid" id="grid"></div>
      </div>

      <!-- SETTINGS -->
      <div class="panel" id="settings" style="color:var(--muted)">
        Advanced settings panel (intentionally flashy later)
      </div>

      <div class="exec">
        <div class="exec-btn">▶️</div>
        <div class="exec-btn">🧹</div>
      </div>

    </div>
  </div>
</div>

<script>
/* =========================
   NAV
========================= */
function openPanel(id){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function dismiss(){
  document.getElementById('disclaimer').style.display='none';
  openPanel('editor');
}

/* =========================
   INDEXEDDB IMAGE CACHE
========================= */
let db;
const req = indexedDB.open("parallax-cache",1);
req.onupgradeneeded = e => {
  db = e.target.result;
  db.createObjectStore("images");
};
req.onsuccess = e => db = e.target.result;

function cacheImage(key, blob){
  const tx = db.transaction("images","readwrite");
  tx.objectStore("images").put(blob,key);
}

function getCachedImage(key){
  return new Promise(res=>{
    const tx = db.transaction("images","readonly");
    const r = tx.objectStore("images").get(key);
    r.onsuccess = ()=>res(r.result);
    r.onerror = ()=>res(null);
  });
}

/* =========================
   SCRIPTBLOX
========================= */
async function loadScripts(q=""){
  const r = await fetch(`https://scriptblox.com/api/script/search?q=${encodeURIComponent(q)}`);
  const d = await r.json();
  const g = document.getElementById("grid");
  g.innerHTML="";

  for(const s of d.result.scripts){
    const card = document.createElement("div");
    card.className="card";

    const thumb = document.createElement("div");
    thumb.className="thumb";
    const img = document.createElement("img");

    if(s.game?.imageUrl){
      const cached = await getCachedImage(s.game.imageUrl);
      if(cached){
        img.src = URL.createObjectURL(cached);
      } else {
        const b = await fetch(s.game.imageUrl).then(r=>r.blob());
        cacheImage(s.game.imageUrl,b);
        img.src = URL.createObjectURL(b);
      }
    }

    thumb.appendChild(img);

    card.innerHTML = `
      <div class="card-info">
        <b>${s.title}</b><br>
        <small>${s.game?.name || "Universal"}</small>
      </div>
    `;
    card.prepend(thumb);

    card.onclick = async ()=>{
      const raw = await fetch(`https://scriptblox.com/api/script/raw/${s._id}`).then(r=>r.text());
      openPanel("editor");
      document.querySelector(".editor").innerText = raw;
    };

    g.appendChild(card);
  }
}

function search(){
  loadScripts(document.getElementById("search").value);
}

loadScripts();
</script>
</body>
</html>
