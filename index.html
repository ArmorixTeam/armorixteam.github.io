<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Parallax Executor UI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #050507;
  --panel: #0b0b10;
  --border: #1c1c2a;
  --text: #ffffff;
  --muted: #9a9ab0;
  --accent: #7a5cff;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: Inter, system-ui;
  background: radial-gradient(circle at top, #0d0d1c, #000);
  color: var(--text);
  overflow: hidden;
}

/* ===== LAYOUT ===== */
#app {
  display: flex;
  width: 100%;
  height: 100%;
}

#sidebar-wrapper {
  width: 86px;
  display: flex;
  justify-content: center;
  align-items: center;
}

#sidebar {
  height: 70%;
  width: 64px;
  background: linear-gradient(180deg, #0d0d1b, #07070f);
  border: 1px solid var(--border);
  border-radius: 18px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 22px;
}

.sidebar-btn {
  width: 44px;
  height: 44px;
  margin: 0 auto;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: 0.25s;
}

.sidebar-btn.active {
  background: rgba(122,92,255,0.18);
  box-shadow: 0 0 18px rgba(122,92,255,0.35);
}

.sidebar-btn svg {
  width: 22px;
  height: 22px;
  fill: white;
}

#content {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 16px;
  overflow: hidden;
}

/* ===== HEADER ===== */
#header {
  font-size: 26px;
  font-weight: 700;
  margin-bottom: 10px;
}

/* ===== DISCLAIMER ===== */
#disclaimer {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 26px;
  text-align: center;
  animation: fadeIn 0.4s ease;
}

#disclaimer svg {
  width: 64px;
  height: 64px;
  fill: var(--accent);
}

#disclaimer button {
  margin-top: 18px;
  background: var(--accent);
  border: none;
  padding: 12px 28px;
  border-radius: 12px;
  font-weight: 600;
  cursor: pointer;
}

/* ===== PANELS ===== */
.panel {
  flex: 1;
  display: none;
  overflow: hidden;
}
.panel.active {
  display: flex;
  flex-direction: column;
}

/* ===== SCRIPT EDITOR ===== */
#editor-tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 6px;
}

.tab {
  padding: 6px 12px;
  border-radius: 10px;
  background: #111;
  cursor: pointer;
}

.tab.active {
  background: var(--accent);
}

#editor {
  flex: 1;
  background: #020205;
  border-radius: 14px;
  border: 1px solid var(--border);
  padding: 14px;
  font-family: monospace;
  overflow-y: auto;
  color: #eaeaff;
  white-space: pre;
}

/* iPad fix */
@media (min-width: 768px) {
  #editor {
    margin-top: auto;
    min-height: 65vh;
  }
}

/* ===== EXEC BUTTONS ===== */
#exec-bar {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  margin-top: 8px;
}

.exec-btn {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: linear-gradient(135deg, #7a5cff, #a98bff);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ===== SCRIPTBLOX ===== */
#scriptblox-search {
  padding: 10px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: #08080f;
  color: white;
}

#scriptblox-list {
  margin-top: 10px;
  flex: 1;
  overflow-y: auto;
}

.script-card {
  display: flex;
  gap: 12px;
  padding: 12px;
  border-bottom: 1px solid var(--border);
}

.script-card img {
  width: 52px;
  height: 52px;
  border-radius: 10px;
}

/* ===== SETTINGS ===== */
.setting {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px;
  border-bottom: 1px solid var(--border);
}

.toggle {
  width: 48px;
  height: 26px;
  background: #222;
  border-radius: 13px;
  position: relative;
}

.toggle::after {
  content: '';
  width: 20px;
  height: 20px;
  background: white;
  border-radius: 50%;
  position: absolute;
  top: 3px;
  left: 3px;
  transition: 0.25s;
}

.toggle.on {
  background: var(--accent);
}
.toggle.on::after {
  left: 25px;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.98); }
  to { opacity: 1; transform: scale(1); }
}
</style>
</head>

<body>
<div id="app">

  <div id="sidebar-wrapper">
    <div id="sidebar">
      <div class="sidebar-btn active" data-panel="editorPanel"></div>
      <div class="sidebar-btn" data-panel="scriptbloxPanel"></div>
      <div class="sidebar-btn" data-panel="savedPanel"></div>
      <div class="sidebar-btn" data-panel="settingsPanel"></div>
    </div>
  </div>

  <div id="content">
    <div id="header">Parallax</div>

    <div id="disclaimer">
      <svg viewBox="0 0 24 24"><path d="M1 21h22L12 2z"/></svg>
      <h2>Disclaimer</h2>
      <p>Use at your own risk. Parallax is not responsible for any bans.</p>
      <button onclick="dismissDisclaimer()">Continue</button>
    </div>

    <div id="editorPanel" class="panel active">
      <div id="editor-tabs"></div>
      <div id="editor" contenteditable></div>
      <div id="exec-bar">
        <div class="exec-btn"></div>
        <div class="exec-btn"></div>
      </div>
    </div>

    <div id="scriptbloxPanel" class="panel">
      <input id="scriptblox-search" placeholder="Search ScriptBlox..." />
      <div id="scriptblox-list"></div>
    </div>

    <div id="savedPanel" class="panel"></div>
    <div id="settingsPanel" class="panel"></div>
  </div>

</div>

<script>
/* ===== DISCLAIMER ===== */
function dismissDisclaimer() {
  document.getElementById('disclaimer').style.display = 'none';
}

/* ===== SIDEBAR ===== */
document.querySelectorAll('.sidebar-btn').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    document.querySelectorAll('.sidebar-btn').forEach(b=>b.classList.remove('active'));
    document.getElementById(btn.dataset.panel).classList.add('active');
    btn.classList.add('active');
  }
});

/* ===== SCRIPTBLOX ===== */
let page = 1;
let loading = false;
let cache = JSON.parse(localStorage.getItem('imgCache')||'{}');

async function loadScripts(q="") {
  if (loading) return;
  loading = true;
  const res = await fetch(`https://scriptblox.com/api/script/search?q=${q}&page=${page}`);
  const data = await res.json();
  if (!data.result.length) {
    document.getElementById('scriptblox-list').innerHTML += "<p>No results.</p>";
    loading=false;
    return;
  }
  data.result.forEach(s=>{
    let img = cache[s.game.image] || s.game.image;
    cache[s.game.image] = img;
    const card = document.createElement('div');
    card.className='script-card';
    card.innerHTML=`<img src="${img}"><div>${s.title}</div>`;
    document.getElementById('scriptblox-list').appendChild(card);
  });
  localStorage.setItem('imgCache',JSON.stringify(cache));
  page++;
  loading=false;
}

document.getElementById('scriptblox-list').onscroll = e=>{
  const el=e.target;
  if(el.scrollTop+el.clientHeight>=el.scrollHeight-100) loadScripts();
};

document.getElementById('scriptblox-search').oninput=e=>{
  page=1;
  document.getElementById('scriptblox-list').innerHTML="";
  loadScripts(e.target.value);
};

/* ===== SETTINGS ===== */
['Robux Purchases','Script Anti-Scam','Verify Teleports','Anti Kick','Luau Highlighting'].forEach(s=>{
  const div=document.createElement('div');
  div.className='setting';
  div.innerHTML=`<span>${s}</span><div class="toggle on"></div>`;
  div.querySelector('.toggle').onclick=e=>e.target.classList.toggle('on');
  settingsPanel.appendChild(div);
});
</script>
</body>
</html>
