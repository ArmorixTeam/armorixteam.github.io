<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Parallax</title>

<!-- Inter Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0b0b0f;
  --panel: #12121a;
  --text: #ffffff;
  --muted: #a0a0b8;
  --purple: #8b5cf6;
  --purple-soft: rgba(139,92,246,0.35);
  --border: rgba(255,255,255,0.08);
}

* {
  box-sizing: border-box;
  font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

html, body {
  margin: 0;
  padding: 0;
  background: radial-gradient(1200px 600px at top, #141428, var(--bg));
  color: var(--text);
  height: 100%;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Fade in */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.app {
  width: 100%;
  height: 100svh;
  max-width: 1200px;
  display: flex;
  animation: fadeIn 0.5s ease;
}

/* Sidebar */
.sidebar {
  width: 64px;
  background: linear-gradient(180deg, #0f0f18, #0b0b0f);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 0;
  gap: 14px;
}

.sidebar button {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: transparent;
  border: none;
  color: var(--muted);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: all 0.2s ease;
}

.sidebar button.active,
.sidebar button:hover {
  background: var(--panel);
  color: var(--purple);
  box-shadow: 0 0 0 1px var(--border), 0 0 12px var(--purple-soft);
}

/* Main */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Header */
.header {
  padding: 16px 20px;
  font-size: 20px;
  font-weight: 600;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(90deg, rgba(139,92,246,0.12), transparent);
}

/* Panels */
.panel {
  flex: 1;
  display: none;
  animation: fadeIn 0.3s ease;
}

.panel.active {
  display: flex;
}

/* Disclaimer */
.disclaimer {
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  gap: 16px;
}

.triangle {
  width: 90px;
  height: 90px;
  filter: drop-shadow(0 0 16px var(--purple-soft));
}

.disclaimer h2 {
  margin: 0;
}

.disclaimer p {
  max-width: 360px;
  color: var(--muted);
}

.disclaimer button {
  margin-top: 10px;
  padding: 12px 22px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(135deg, var(--purple), #6d28d9);
  color: white;
  font-weight: 600;
  cursor: pointer;
}

/* Editor */
.editor-container {
  flex: 1;
  display: flex;
  padding: 16px;
  gap: 16px;
}

.editor {
  flex: 1;
  background: var(--panel);
  border-radius: 16px;
  border: 1px solid var(--border);
  padding: 14px;
  font-family: monospace;
  color: #e5e7eb;
  outline: none;
  overflow: auto;
  white-space: pre;
}

.keyword { color: #8b5cf6; }
.string { color: #34d399; }
.comment { color: #6b7280; }

/* ScriptBlox */
.scriptblox {
  padding: 16px;
  overflow-y: auto;
}

.script {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.script:hover {
  box-shadow: 0 0 0 1px var(--purple-soft);
}

/* Settings */
.settings {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.toggle {
  display: flex;
  justify-content: space-between;
  background: var(--panel);
  border-radius: 14px;
  padding: 14px;
  border: 1px solid var(--border);
}

.switch {
  width: 44px;
  height: 24px;
  border-radius: 999px;
  background: #1f2933;
  position: relative;
}

.switch::after {
  content: "";
  position: absolute;
  width: 18px;
  height: 18px;
  background: white;
  border-radius: 50%;
  top: 3px;
  left: 3px;
}

/* Execute Buttons */
.execute-bar {
  position: absolute;
  bottom: 18px;
  right: 18px;
  display: flex;
  gap: 10px;
}

.exec-btn {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: var(--panel);
  border: 1px solid var(--border);
  display: grid;
  place-items: center;
  cursor: pointer;
}

.exec-btn:hover {
  box-shadow: 0 0 16px var(--purple-soft);
}
</style>
</head>

<body>
<div class="app">

  <!-- Sidebar -->
  <div class="sidebar">
    <button class="active" onclick="showPanel('editor')">✏️</button>
    <button onclick="showPanel('scriptblox')">☁️</button>
    <button onclick="showPanel('saved')">📁</button>
    <button onclick="showPanel('settings')">⚙️</button>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="header">Parallax</div>

    <!-- Disclaimer -->
    <div class="panel active disclaimer" id="disclaimer">
      <svg class="triangle" viewBox="0 0 24 24" fill="none" stroke="purple" stroke-width="1.5">
        <path d="M12 2L22 20H2L12 2Z"/>
      </svg>
      <h2>Disclaimer</h2>
      <p>
        Use at your own risk.<br>
        Parallax is not responsible for any bans or disciplinary action caused.
      </p>
      <button onclick="dismissDisclaimer()">Continue</button>
    </div>

    <!-- Editor -->
    <div class="panel" id="editor">
      <div class="editor-container">
        <div class="editor" contenteditable spellcheck="false" oninput="highlight(this)">
-- Parallax Executor
print("Hello World")
        </div>
      </div>
    </div>

    <!-- ScriptBlox -->
    <div class="panel scriptblox" id="scriptblox"></div>

    <!-- Saved -->
    <div class="panel" id="saved" style="padding:20px;color:var(--muted)">
      Saved Scripts (placeholder)
    </div>

    <!-- Settings -->
    <div class="panel settings" id="settings">
      <div class="toggle"><span>Robux Purchases</span><div class="switch"></div></div>
      <div class="toggle"><span>Script Anti-Scam</span><div class="switch"></div></div>
      <div class="toggle"><span>Verify Teleports</span><div class="switch"></div></div>
      <div class="toggle"><span>Anti Kick</span><div class="switch"></div></div>
    </div>

    <!-- Fake Execute Buttons -->
    <div class="execute-bar">
      <div class="exec-btn">▶️</div>
      <div class="exec-btn">🗑️</div>
    </div>

  </div>
</div>

<script>
function showPanel(id) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.sidebar button').forEach(b => b.classList.remove('active'));
}

function dismissDisclaimer() {
  document.getElementById('disclaimer').style.display = 'none';
  showPanel('editor');
}

function highlight(el) {
  let text = el.innerText
    .replace(/(print|function|end|local)/g, '<span class="keyword">$1</span>')
    .replace(/(".*?")/g, '<span class="string">$1</span>')
    .replace(/(--.*)/g, '<span class="comment">$1</span>');
  el.innerHTML = text;
  placeCaretAtEnd(el);
}

function placeCaretAtEnd(el) {
  const range = document.createRange();
  range.selectNodeContents(el);
  range.collapse(false);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

/* ScriptBlox API */
fetch("https://scriptblox.com/api/script/fetch?page=1")
  .then(res => res.json())
  .then(data => {
    const container = document.getElementById("scriptblox");
    data.result.scripts.forEach(s => {
      const div = document.createElement("div");
      div.className = "script";
      div.innerHTML = `<strong>${s.title}</strong><br><small>${s.game?.name || "Universal"}</small>`;
      div.onclick = () => {
        showPanel('editor');
        document.querySelector('.editor').innerText = s.script || "-- Unable to load script";
      };
      container.appendChild(div);
    });
  });
</script>
</body>
</html>
