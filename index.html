<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parallax</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ================== THEME ================== */
:root{
  --bg:#05050a;
  --panel:#0d0d1a;
  --panel-soft:rgba(20,20,40,.75);
  --border:rgba(255,255,255,.08);
  --text:#ffffff;
  --muted:#9aa0b4;
  --purple:#8b5cf6;
  --glow:0 0 24px rgba(139,92,246,.45);
}

*{box-sizing:border-box;font-family:Inter,system-ui}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden}

/* ================== LAYOUT ================== */
.app{
  height:100svh;
  display:grid;
  grid-template-columns:100px 1fr;
}

/* ================== SIDEBAR ================== */
.sidebar{
  display:flex;
  justify-content:center;
  align-items:center;
}

.nav-wrap{
  background:linear-gradient(180deg,#0b0b15,#06060c);
  border:1px solid var(--border);
  border-radius:26px;
  padding:14px 12px;
  display:flex;
  flex-direction:column;
  gap:14px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.02);
}

.logo{
  font-weight:800;
  letter-spacing:2px;
  color:var(--purple);
  text-align:center;
  margin-bottom:6px;
}

.nav-btn{
  width:56px;height:56px;
  border-radius:18px;
  display:grid;place-items:center;
  color:var(--muted);
  cursor:pointer;
  transition:.25s;
}

.nav-btn.active,
.nav-btn:hover{
  background:rgba(139,92,246,.18);
  color:var(--purple);
  box-shadow:var(--glow);
}

/* ================== MAIN ================== */
.main{display:flex;flex-direction:column;height:100%}

.header{
  height:60px;
  display:flex;
  align-items:center;
  padding:0 22px;
  border-bottom:1px solid var(--border);
  font-weight:700;
}

.content{
  flex:1;
  position:relative;
  overflow:hidden;
}

/* ================== PANELS ================== */
.panel{
  position:absolute;
  inset:0;
  padding:16px;
  display:none;
}

.panel.active{
  display:flex;
  animation:fade .25s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:none}
}

/* ================== DISCLAIMER ================== */
#disclaimer{
  justify-content:center;
  align-items:center;
  text-align:center;
  flex-direction:column;
  gap:18px;
}

#disclaimer button{
  padding:14px 34px;
  border-radius:18px;
  border:none;
  background:linear-gradient(135deg,var(--purple),#a78bfa);
  color:white;
  font-weight:700;
}

/* ================== EDITOR ================== */
#editor{flex-direction:column;gap:12px}

.tabs{
  display:flex;
  gap:8px;
  align-items:center;
}

.tab{
  padding:8px 14px;
  border-radius:12px;
  background:var(--panel);
  border:1px solid var(--border);
  color:var(--muted);
  cursor:pointer;
  transition:.2s;
}

.tab.active{
  color:white;
  box-shadow:var(--glow);
}

.tab.add{font-weight:800}

.editor{
  flex:1;
  background:var(--panel-soft);
  border:1px solid var(--border);
  border-radius:22px;
  padding:18px;
  font-family:ui-monospace,SFMono-Regular;
  white-space:pre;
  overflow:auto;
  outline:none;
}

/* ================== SCRIPTBLOX ================== */
#scriptblox{
  flex-direction:column;
  gap:12px;
}

.sb-search{
  display:flex;
  gap:10px;
}

.sb-search input{
  flex:1;
  padding:14px;
  border-radius:16px;
  border:1px solid var(--border);
  background:var(--panel);
  color:white;
}

.sb-results{
  flex:1;
  overflow:auto;
}

.sb-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:14px;
}

.card{
  background:var(--panel-soft);
  border:1px solid var(--border);
  border-radius:20px;
  overflow:hidden;
  cursor:pointer;
  transition:.25s;
}

.card:hover{
  transform:translateY(-4px);
  box-shadow:var(--glow);
}

.thumb{height:130px;background:black}
.thumb img{width:100%;height:100%;object-fit:cover}

.card-info{padding:12px}
.card-info small{color:var(--muted)}

.empty{
  height:100%;
  display:none;
  align-items:center;
  justify-content:center;
  color:var(--muted);
}

/* ================== SAVED SCRIPTS ================== */
#saved{
  flex-direction:column;
  gap:12px;
}

.saved-list{
  flex:1;
  overflow:auto;
}

.saved-item{
  padding:12px;
  border-radius:14px;
  border:1px solid var(--border);
  margin-bottom:10px;
  cursor:pointer;
}

/* ================== EXEC BUTTONS ================== */
.exec{
  position:absolute;
  right:18px;
  bottom:18px;
  display:none;
  gap:14px;
}

.exec-btn{
  width:58px;height:58px;
  border-radius:20px;
  background:linear-gradient(135deg,#15152e,#090912);
  border:1px solid var(--border);
  display:grid;place-items:center;
}
.exec-btn:hover{box-shadow:var(--glow)}
</style>
</head>

<body>
<div class="app">

<div class="sidebar">
  <div class="nav-wrap">
    <div class="logo">PX</div>
    <div class="nav-btn active" data-panel="editor">✏️</div>
    <div class="nav-btn" data-panel="scriptblox">☁️</div>
    <div class="nav-btn" data-panel="saved">💾</div>
    <div class="nav-btn" data-panel="settings">⚙️</div>
  </div>
</div>

<div class="main">
  <div class="header">Parallax</div>
  <div class="content">

    <div class="panel active" id="disclaimer">
      <h2>Disclaimer</h2>
      <p style="color:var(--muted)">Use at your own risk.</p>
      <button onclick="dismiss()">Continue</button>
    </div>

    <div class="panel" id="editor">
      <div class="tabs" id="tabs">
        <div class="tab active">Script 1</div>
        <div class="tab add" onclick="newTab()">+</div>
      </div>
      <div class="editor" id="editorBox" contenteditable spellcheck="false">print("Parallax Ready")</div>
    </div>

    <div class="panel" id="scriptblox">
      <div class="sb-search">
        <input id="search" placeholder="Search ScriptBlox">
        <button onclick="search()">Search</button>
      </div>
      <div class="sb-results">
        <div class="sb-grid" id="grid"></div>
        <div class="empty" id="empty">No scripts found.</div>
      </div>
    </div>

    <div class="panel" id="saved">
      <button onclick="saveCurrent()">Save Current Script</button>
      <div class="saved-list" id="savedList"></div>
    </div>

    <div class="panel" id="settings">Settings</div>

    <div class="exec" id="exec">
      <div class="exec-btn">▶️</div>
      <div class="exec-btn">🧹</div>
    </div>

  </div>
</div>
</div>

<script>
/* ================== STATE ================== */
let tabs=[{name:"Script 1",code:document.getElementById("editorBox").innerText}];
let activeTab=0;

/* ================== NAV ================== */
function setPanel(id){
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  document.querySelectorAll(".nav-btn").forEach(n=>n.classList.remove("active"));
  document.querySelector(`.nav-btn[data-panel="${id}"]`)?.classList.add("active");

  document.getElementById("exec").style.display = id==="editor" ? "flex":"none";
}

document.querySelectorAll(".nav-btn").forEach(b=>{
  b.onclick=()=>setPanel(b.dataset.panel);
});

function dismiss(){
  document.getElementById("disclaimer").style.display="none";
  setPanel("editor");
}

/* ================== TABS ================== */
function renderTabs(){
  const t=document.getElementById("tabs");
  t.innerHTML="";
  tabs.forEach((tab,i)=>{
    const d=document.createElement("div");
    d.className="tab"+(i===activeTab?" active":"");
    d.textContent=tab.name;
    d.onclick=()=>switchTab(i);
    t.appendChild(d);
  });
  const add=document.createElement("div");
  add.className="tab add";
  add.textContent="+";
  add.onclick=newTab;
  t.appendChild(add);
}

function newTab(){
  tabs.push({name:"Script "+(tabs.length+1),code:""});
  switchTab(tabs.length-1);
}

function switchTab(i){
  tabs[activeTab].code=document.getElementById("editorBox").innerText;
  activeTab=i;
  document.getElementById("editorBox").innerText=tabs[i].code;
  renderTabs();
}

renderTabs();

/* ================== SAVED ================== */
function saveCurrent(){
  const saved=JSON.parse(localStorage.getItem("savedScripts")||"[]");
  saved.push({title:tabs[activeTab].name,code:tabs[activeTab].code});
  localStorage.setItem("savedScripts",JSON.stringify(saved));
  loadSaved();
}

function loadSaved(){
  const list=document.getElementById("savedList");
  list.innerHTML="";
  const saved=JSON.parse(localStorage.getItem("savedScripts")||"[]");
  saved.forEach(s=>{
    const d=document.createElement("div");
    d.className="saved-item";
    d.textContent=s.title;
    d.onclick=()=>{
      tabs.push({name:s.title,code:s.code});
      switchTab(tabs.length-1);
      setPanel("editor");
    };
    list.appendChild(d);
  });
}
loadSaved();

/* ================== SCRIPTBLOX ================== */
async function search(){
  const q=document.getElementById("search").value;
  const grid=document.getElementById("grid");
  const empty=document.getElementById("empty");
  grid.innerHTML="";
  empty.style.display="none";
  try{
    const r=await fetch(`https://scriptblox.com/api/script/search?q=${encodeURIComponent(q)}`);
    const d=await r.json();
    if(!d.result.scripts.length){empty.style.display="flex";return;}
    d.result.scripts.forEach(s=>{
      const c=document.createElement("div");
      c.className="card";
      c.innerHTML=`
        <div class="thumb"><img src="${s.game?.imageUrl||""}"></div>
        <div class="card-info"><b>${s.title}</b><br><small>${s.game?.name||"Universal"}</small></div>`;
      c.onclick=async()=>{
        const raw=await fetch(`https://scriptblox.com/api/script/raw/${s._id}`).then(r=>r.text());
        tabs.push({name:s.title,code:raw});
        switchTab(tabs.length-1);
        setPanel("editor");
      };
      grid.appendChild(c);
    });
  }catch(e){
    empty.style.display="flex";
    empty.textContent="ScriptBlox error.";
  }
}
</script>
</body>
</html>
