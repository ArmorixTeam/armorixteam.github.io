<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Parallax</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#05050a;
  --panel:rgba(18,18,30,.7);
  --panel-solid:#0f0f1a;
  --border:rgba(255,255,255,.08);
  --text:#fff;
  --muted:#9aa0b4;
  --purple:#8b5cf6;
  --glow:0 0 30px rgba(139,92,246,.45);
}

*{box-sizing:border-box;font-family:Inter,system-ui}

html,body{
  margin:0;height:100%;
  background:radial-gradient(1200px 600px at top,#101028,var(--bg));
  color:var(--text);
  overflow:hidden;
}

/* ===== LAYOUT ===== */
.app{
  height:100svh;
  display:grid;
  grid-template-columns:96px 1fr;
}

/* ===== SIDEBAR ===== */
.sidebar{
  display:flex;
  justify-content:center;
  align-items:center;
}

.nav-wrap{
  background:linear-gradient(180deg,#0b0b15,#07070c);
  border:1px solid var(--border);
  border-radius:24px;
  padding:14px 10px;
  display:flex;
  flex-direction:column;
  gap:14px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.02);
}

.logo{
  text-align:center;
  font-weight:800;
  letter-spacing:2px;
  color:var(--purple);
  margin-bottom:6px;
}

.nav-btn{
  width:52px;height:52px;
  border-radius:16px;
  display:grid;place-items:center;
  color:var(--muted);
  cursor:pointer;
  transition:.25s;
}

.nav-btn.active,
.nav-btn:hover{
  background:rgba(139,92,246,.15);
  color:var(--purple);
  box-shadow:var(--glow);
}

/* ===== MAIN ===== */
.main{display:flex;flex-direction:column;height:100%}

.header{
  height:58px;
  display:flex;
  align-items:center;
  padding:0 20px;
  border-bottom:1px solid var(--border);
  font-weight:700;
}

.content{
  flex:1;
  position:relative;
}

/* ===== PANELS ===== */
.panel{
  position:absolute;
  inset:0;
  padding:16px;
  display:none;
}

.panel.active{
  display:flex;
  animation:fade .25s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}

/* ===== DISCLAIMER ===== */
.disclaimer{
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  gap:16px;
}

.disclaimer button{
  padding:14px 30px;
  border-radius:18px;
  border:none;
  background:linear-gradient(135deg,var(--purple),#a78bfa);
  font-weight:700;
  color:white;
}

/* ===== EDITOR ===== */
.editor-wrap{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.tabs{
  display:flex;
  gap:8px;
}

.tab{
  padding:8px 14px;
  border-radius:12px;
  background:var(--panel-solid);
  border:1px solid var(--border);
  color:var(--muted);
  cursor:pointer;
}

.tab.active{
  color:white;
  box-shadow:var(--glow);
}

.editor{
  flex:1;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:22px;
  padding:18px;
  font-family:ui-monospace,SFMono-Regular;
  white-space:pre;
  overflow:auto;
  outline:none;
}

/* ===== SCRIPTBLOX ===== */
.scriptblox{
  flex-direction:column;
  gap:14px;
  overflow:hidden;
}

.sb-search{
  display:flex;
  gap:10px;
}

.sb-search input{
  flex:1;
  padding:14px;
  border-radius:16px;
  border:1px solid var(--border);
  background:var(--panel-solid);
  color:white;
}

.sb-results{
  flex:1;
  overflow:auto;
}

.sb-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:14px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:20px;
  overflow:hidden;
  cursor:pointer;
  transition:.25s;
}

.card:hover{
  transform:translateY(-4px);
  box-shadow:var(--glow);
}

.thumb{height:130px;background:black}
.thumb img{width:100%;height:100%;object-fit:cover}

.card-info{padding:12px}
.card-info small{color:var(--muted)}

.empty{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--muted);
  font-size:14px;
}

/* ===== EXEC BUTTONS ===== */
.exec{
  position:absolute;
  right:18px;
  bottom:18px;
  display:flex;
  gap:14px;
}

.exec-btn{
  width:56px;height:56px;
  border-radius:20px;
  background:linear-gradient(135deg,#15152e,#090912);
  border:1px solid var(--border);
  display:grid;place-items:center;
}
.exec-btn:hover{box-shadow:var(--glow)}
</style>
</head>

<body>
<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="nav-wrap">
      <div class="logo">PX</div>
      <div class="nav-btn active" data-panel="editor">✏️</div>
      <div class="nav-btn" data-panel="scriptblox">☁️</div>
      <div class="nav-btn" data-panel="settings">⚙️</div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="header">Parallax</div>

    <div class="content">

      <!-- DISCLAIMER -->
      <div class="panel active disclaimer" id="disclaimer">
        <h2>Disclaimer</h2>
        <p style="color:var(--muted);max-width:420px">
          Use at your own risk. Parallax is not responsible for bans or disciplinary action.
        </p>
        <button onclick="dismiss()">Continue</button>
      </div>

      <!-- EDITOR -->
      <div class="panel" id="editor">
        <div class="editor-wrap">
          <div class="tabs">
            <div class="tab active">Script 1</div>
            <div class="tab">Script 2</div>
          </div>
          <div class="editor" contenteditable spellcheck="false">
-- Parallax Executor
print("Ready")
          </div>
        </div>
      </div>

      <!-- SCRIPTBLOX -->
      <div class="panel scriptblox" id="scriptblox">
        <div class="sb-search">
          <input id="search" placeholder="Search ScriptBlox…" />
          <button onclick="search()">Search</button>
        </div>
        <div class="sb-results">
          <div class="sb-grid" id="grid"></div>
          <div class="empty" id="empty" style="display:none">
            No scripts found.
          </div>
        </div>
      </div>

      <!-- SETTINGS -->
      <div class="panel" id="settings" style="color:var(--muted)">
        Settings panel
      </div>

      <!-- EXEC -->
      <div class="exec">
        <div class="exec-btn">▶️</div>
        <div class="exec-btn">🧹</div>
      </div>

    </div>
  </div>
</div>

<script>
/* NAV */
document.querySelectorAll('.nav-btn').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.nav-btn').forEach(n=>n.classList.remove('active'));
    b.classList.add('active');
    open(b.dataset.panel);
  }
});

function open(id){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function dismiss(){
  document.getElementById('disclaimer').style.display='none';
  open('editor');
}

/* SCRIPTBLOX */
async function load(q=""){
  const r=await fetch(`https://scriptblox.com/api/script/search?q=${encodeURIComponent(q)}`);
  const d=await r.json();
  const g=document.getElementById("grid");
  const e=document.getElementById("empty");
  g.innerHTML="";

  if(!d.result.scripts.length){
    e.style.display="flex";
    return;
  }
  e.style.display="none";

  for(const s of d.result.scripts){
    const c=document.createElement("div");
    c.className="card";
    c.innerHTML=`
      <div class="thumb"><img src="${s.game?.imageUrl||""}"></div>
      <div class="card-info">
        <b>${s.title}</b><br>
        <small>${s.game?.name||"Universal"}</small>
      </div>`;
    c.onclick=async()=>{
      const raw=await fetch(`https://scriptblox.com/api/script/raw/${s._id}`).then(r=>r.text());
      open('editor');
      document.querySelector('.editor').innerText=raw;
    };
    g.appendChild(c);
  }
}

function search(){load(document.getElementById("search").value)}
load();
</script>
</body>
</html>
