<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parallax</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#05050a;
  --panel:rgba(18,18,30,.75);
  --panel-solid:#0f0f1a;
  --border:rgba(255,255,255,.08);
  --text:#fff;
  --muted:#9aa0b4;
  --purple:#8b5cf6;
  --glow:0 0 30px rgba(139,92,246,.45);
}

*{box-sizing:border-box;font-family:Inter}

html,body{
  margin:0;height:100%;
  background:radial-gradient(1200px 600px at top,#101028,var(--bg));
  color:var(--text);
  overflow:hidden;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}

/* LAYOUT */
.app{height:100svh;display:grid;grid-template-columns:96px 1fr}

/* SIDEBAR */
.sidebar{display:flex;justify-content:center;align-items:center}
.nav-wrap{
  background:linear-gradient(180deg,#0b0b15,#07070c);
  border:1px solid var(--border);
  border-radius:24px;
  padding:14px 10px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.logo{
  font-weight:800;
  letter-spacing:2px;
  color:var(--purple);
  text-align:center;
}
.nav-btn{
  width:52px;height:52px;
  border-radius:16px;
  display:grid;place-items:center;
  color:var(--muted);
  cursor:pointer;
  transition:.25s;
}
.nav-btn.active,.nav-btn:hover{
  background:rgba(139,92,246,.15);
  color:var(--purple);
  box-shadow:var(--glow);
}

/* MAIN */
.main{display:flex;flex-direction:column;height:100%}
.header{
  height:58px;
  display:flex;
  align-items:center;
  padding:0 20px;
  border-bottom:1px solid var(--border);
  font-weight:700;
}

/* PANELS */
.content{flex:1;position:relative}
.panel{
  position:absolute;
  inset:0;
  padding:16px 16px 120px;
  display:none;
}
.panel.active{
  display:flex;
  animation:fadeUp .25s ease;
}

/* EDITOR */
.editor-wrap{flex:1;display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;gap:8px}
.tab{
  padding:8px 14px;
  border-radius:12px;
  background:var(--panel-solid);
  border:1px solid var(--border);
  color:var(--muted);
  cursor:pointer;
  transition:.2s;
}
.tab.active{
  color:white;
  box-shadow:var(--glow);
}
.editor{
  flex:1;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:22px;
  padding:18px;
  font-family:ui-monospace,SFMono-Regular;
  white-space:pre;
  overflow:auto;
  outline:none;
}

/* SCRIPTBLOX */
.scriptblox{flex-direction:column;gap:14px}
.sb-search{display:flex;gap:10px}
.sb-search input{
  flex:1;padding:14px;border-radius:16px;
  border:1px solid var(--border);
  background:var(--panel-solid);color:white;
}
.sb-results{flex:1;overflow:auto}
.sb-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:14px;
}
.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:20px;
  overflow:hidden;
  cursor:pointer;
  transition:.25s;
}
.card:hover{transform:translateY(-4px);box-shadow:var(--glow)}
.thumb{height:130px;background:black}
.thumb img{width:100%;height:100%;object-fit:cover}
.card-info{padding:12px}
.card-info small{color:var(--muted)}
.save-btn{
  margin-top:8px;
  font-size:12px;
  color:var(--purple);
}

/* SAVED */
.saved{flex-direction:column;gap:12px;overflow:auto}
.saved-item{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
  display:flex;
  justify-content:space-between;
  cursor:pointer;
}

/* EXEC BAR */
.exec{
  position:absolute;
  right:18px;
  bottom:18px;
  display:flex;
  gap:14px;
  pointer-events:none;
}
.exec-btn{
  pointer-events:auto;
  width:56px;height:56px;
  border-radius:20px;
  background:linear-gradient(135deg,#15152e,#090912);
  border:1px solid var(--border);
  display:grid;place-items:center;
  transition:.2s;
}
.exec-btn:hover{box-shadow:var(--glow);transform:scale(1.05)}
</style>
</head>

<body>
<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="nav-wrap">
    <div class="logo">PX</div>
    <div class="nav-btn active" data-panel="editor">✏️</div>
    <div class="nav-btn" data-panel="scriptblox">☁️</div>
    <div class="nav-btn" data-panel="saved">📁</div>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="header">Parallax</div>

  <div class="content">

    <!-- EDITOR -->
    <div class="panel active" id="editor">
      <div class="editor-wrap">
        <div class="tabs" id="tabs"></div>
        <div class="editor" id="editorBox" contenteditable spellcheck="false"></div>
      </div>
    </div>

    <!-- SCRIPTBLOX -->
    <div class="panel scriptblox" id="scriptblox">
      <div class="sb-search">
        <input id="search" placeholder="Search ScriptBlox…" />
        <button onclick="search()">Search</button>
      </div>
      <div class="sb-results">
        <div class="sb-grid" id="grid"></div>
      </div>
    </div>

    <!-- SAVED -->
    <div class="panel saved" id="saved"></div>

    <!-- EXEC -->
    <div class="exec">
      <div class="exec-btn">▶️</div>
      <div class="exec-btn">🧹</div>
    </div>

  </div>
</div>
</div>

<script>
/* NAV */
document.querySelectorAll('.nav-btn').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.nav-btn').forEach(n=>n.classList.remove('active'));
    b.classList.add('active');
    openPanel(b.dataset.panel);
  }
});
function openPanel(id){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* EDITOR TABS */
let tabs=[],activeTab=0;
function newTab(title="Script"){
  tabs.push({title,content:""});
  activeTab=tabs.length-1;
  renderTabs();
}
function renderTabs(){
  const t=document.getElementById("tabs");
  t.innerHTML="";
  tabs.forEach((tab,i)=>{
    const d=document.createElement("div");
    d.className="tab"+(i===activeTab?" active":"");
    d.textContent=tab.title;
    d.onclick=()=>switchTab(i);
    t.appendChild(d);
  });
  editorBox.innerText=tabs[activeTab].content;
}
function switchTab(i){
  tabs[activeTab].content=editorBox.innerText;
  activeTab=i;
  renderTabs();
}
editorBox.oninput=()=>tabs[activeTab].content=editorBox.innerText;
newTab("Script 1");

/* SAVED SCRIPTS */
function loadSaved(){
  const s=JSON.parse(localStorage.getItem("saved")||"[]");
  const c=document.getElementById("saved");
  c.innerHTML="";
  s.forEach((x,i)=>{
    const d=document.createElement("div");
    d.className="saved-item";
    d.innerHTML=`<span>${x.title}</span><span>✖</span>`;
    d.onclick=()=>{newTab(x.title);tabs[activeTab].content=x.code;renderTabs()};
    d.lastChild.onclick=e=>{
      e.stopPropagation();
      s.splice(i,1);
      localStorage.setItem("saved",JSON.stringify(s));
      loadSaved();
    };
    c.appendChild(d);
  });
}

/* SCRIPTBLOX */
async function load(q=""){
  const r=await fetch(`https://scriptblox.com/api/script/search?q=${encodeURIComponent(q)}`);
  const d=await r.json();
  const g=document.getElementById("grid");
  g.innerHTML="";
  d.result.scripts.forEach(s=>{
    const c=document.createElement("div");
    c.className="card";
    c.innerHTML=`
      <div class="thumb"><img src="${s.game?.imageUrl||""}"></div>
      <div class="card-info">
        <b>${s.title}</b><br>
        <small>${s.game?.name||"Universal"}</small>
        <div class="save-btn">Save Script</div>
      </div>`;
    c.querySelector(".save-btn").onclick=async e=>{
      e.stopPropagation();
      const code=await fetch(`https://scriptblox.com/api/script/raw/${s._id}`).then(r=>r.text());
      const saved=JSON.parse(localStorage.getItem("saved")||"[]");
      saved.push({title:s.title,code});
      localStorage.setItem("saved",JSON.stringify(saved));
      loadSaved();
    };
    c.onclick=async()=>{
      const code=await fetch(`https://scriptblox.com/api/script/raw/${s._id}`).then(r=>r.text());
      newTab(s.title);
      tabs[activeTab].content=code;
      renderTabs();
      openPanel("editor");
    };
    g.appendChild(c);
  });
}
function search(){load(search.value)}
load();loadSaved();
</script>
</body>
</html>
